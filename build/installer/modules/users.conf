defaultGroups: [ users, sudo, adm, audio, video, plugdev ]
sudoersGroup: sudo
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
displayAutologin: true
doAutologin: false
allowWeakPasswords: false
user:
  shell: /bin/bash
  forbidden_names: [ root, frameos ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: frameos-pc

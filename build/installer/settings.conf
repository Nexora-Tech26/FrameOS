modules-search: [ local ]
sequence:
- show: [ welcome, locale, keyboard, partition, users, summary ]
- exec: [ partition, mount, unpackfs, shellprocess, machineid, fstab, locale, keyboard, localecfg, users, displaymanager, hwclock, initramfs, grubcfg, bootloader, umount ]
- show: [ finished ]
branding: frameos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false

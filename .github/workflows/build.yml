name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
concurrency:
  group: frameos-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ISO: ubuntu-26.10-desktop-amd64.iso
      UPSTREAM: https://releases.ubuntu.com/26.10
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso ubuntu-keyring gnupg squashfs-tools
          df -h
      - name: Verify upstream checksum manifest
        run: |
          mkdir -p .build-cache
          curl -fsSL --retry 3 "$UPSTREAM/SHA256SUMS" -o /tmp/SHA256SUMS
          curl -fsSL --retry 3 "$UPSTREAM/SHA256SUMS.gpg" -o /tmp/SHA256SUMS.gpg
          gpgv --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg /tmp/SHA256SUMS.gpg /tmp/SHA256SUMS
          grep -E "[ *]$ISO$" /tmp/SHA256SUMS > .build-cache/upstream.sha256
      - name: Restore immutable Ubuntu base
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .build-cache/${{ env.ISO }}
          key: frameos-base-amd64-${{ hashFiles('.build-cache/upstream.sha256') }}
      - name: Download and validate base
        run: |
          cd .build-cache
          if ! sha256sum -c upstream.sha256; then
            rm -f "$ISO"
            curl -fL --retry 4 "$UPSTREAM/$ISO" -o "$ISO"
            sha256sum -c upstream.sha256
          fi
      - name: Save validated base for next build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build-cache/${{ env.ISO }}
          key: frameos-base-amd64-${{ hashFiles('.build-cache/upstream.sha256') }}
      - name: Restore optimized layers
        uses: actions/cache@v4
        with:
          path: .build-cache/lean-layers
          key: frameos-lean-${{ hashFiles('.build-cache/upstream.sha256', 'build/lean-iso.sh') }}
      - name: Build lean preview
        run: bash build/lean-iso.sh .build-cache/$ISO dist/FrameOS-1.0-part2-lean-preview-amd64.iso
      - name: Upload ISO and validation reports
        uses: actions/upload-artifact@v4
        with:
          name: FrameOS-1.0-part2-lean-preview-amd64
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

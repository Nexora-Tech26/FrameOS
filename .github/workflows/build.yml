name: Build
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Rebuild package layer from scratch
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'build/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
concurrency:
  group: frameos-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends debootstrap ubuntu-keyring gnupg squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools
          sudo ln -sf gutsy /usr/share/debootstrap/scripts/stonking
      - name: Restore built system layer
        if: inputs.refresh != true
        uses: actions/cache@v4
        with:
          path: .build-cache/minimal
          key: frameos-minimal-stonking-v1-${{ hashFiles('build/minimal-iso.sh', 'build/part2-packages.txt') }}
      - name: Build minimal FrameOS live ISO
        run: bash build/minimal-iso.sh
      - name: Upload ISO and validation reports
        uses: actions/upload-artifact@v4
        with:
          name: FrameOS-1.0-part2-minimal-live-amd64
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['build/**', '.github/workflows/build.yml']
permissions:
  contents: read
concurrency:
  group: frameos-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xorriso ubuntu-keyring gnupg curl debootstrap squashfs-tools git sassc libglib2.0-bin grub-pc-bin grub-efi-amd64-bin mtools
          sudo ln -sf gutsy /usr/share/debootstrap/scripts/resolute
      - uses: actions/cache@v4
        with:
          path: .build-cache/minimal
          key: frameos-resolute-base-${{ hashFiles('build/minimal-iso.sh','build/part2-packages.txt','build/configure-live.sh') }}
      - uses: actions/cache@v4
        with:
          path: .build-cache/frameui
          key: frameos-resolute-ui-${{ hashFiles('build/minimal-iso.sh','build/part2-packages.txt','build/configure-live.sh','build/part3-ui.sh','build/frame-gtk.css') }}
      - name: Build Part 8
        run: |
          bash -n build/part8.sh build/launch-installer.sh
          python3 -m py_compile build/modes.py build/install-extensions.py build/select-packs.py build/install-packs.py
          bash build/part8.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameOS-part8-preview
          path: dist/
          compression-level: 0
          if-no-files-found: error

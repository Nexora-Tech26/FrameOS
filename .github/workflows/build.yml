name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['build/**', '.github/workflows/build.yml']
permissions:
  contents: read
concurrency:
  group: frameos-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xorriso ubuntu-keyring gnupg curl
      - name: Build official installer baseline
        run: |
          bash -n build/part61-baseline.sh
          bash build/part61-baseline.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameOS-part6.1-installer-baseline
          path: dist/
          compression-level: 0
          if-no-files-found: error
